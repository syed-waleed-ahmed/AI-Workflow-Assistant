name: Production health check

# Checks the deployed application every day and on demand. It also keeps the free-tier
# database from being paused for inactivity, because the readiness endpoint runs a query.
#
# Configure in the repository settings → Secrets and variables → Actions → Variables:
#   BACKEND_URL   e.g. https://ai-workflow-assistant-api.onrender.com
#   FRONTEND_URL  e.g. https://ai-workflow-assistant.vercel.app
# The job is skipped until BACKEND_URL is set.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full end-to-end smoke test (uses model quota)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  health:
    name: Readiness
    if: vars.BACKEND_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: API is ready (database, storage, model key)
        run: |
          # The free instance sleeps when idle; allow time for it to wake.
          curl --fail --silent --show-error --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 \
            "${{ vars.BACKEND_URL }}/ready"
      - name: Frontend serves the landing page and proxies the API
        if: vars.FRONTEND_URL != ''
        run: |
          curl --fail --silent --show-error --max-time 60 -o /dev/null "${{ vars.FRONTEND_URL }}/"
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 \
            "${{ vars.FRONTEND_URL }}/api/v1/health"

  smoke:
    name: End-to-end smoke test
    if: vars.BACKEND_URL != '' && github.event_name == 'workflow_dispatch'
    needs: health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Full user journey against production
        run: |
          python backend/scripts/smoke_test.py \
            --base-url "${{ vars.FRONTEND_URL || vars.BACKEND_URL }}" \
            ${{ inputs.full && ' ' || '--skip-analysis' }}
