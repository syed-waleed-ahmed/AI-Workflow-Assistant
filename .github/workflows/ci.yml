name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests scripts
      - name: Format
        run: ruff format --check app tests scripts
      - name: Type check
        run: mypy
      - name: Tests (SQLite)
        run: pytest --cov=app --cov-report=term --cov-fail-under=85
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: awa
          POSTGRES_PASSWORD: awa
          POSTGRES_DB: awa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U awa -d awa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://awa:awa@localhost:5432/awa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql://awa:awa@localhost:5432/awa_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests (PostgreSQL)
        run: pytest

  backend-image:
    name: Backend (container image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t awa-api ./backend
      - name: Image refuses to start with an unsafe production configuration
        run: |
          if docker run --rm -e DATABASE_URL=sqlite:///x.db awa-api python -c "import app.main" 2>err.txt; then
            echo "expected startup to fail without a production configuration"; exit 1
          fi
          grep -q "SECRET_KEY" err.txt
      - name: Image runs as a non-root user
        run: test "$(docker run --rm awa-api id -u)" != "0"

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
