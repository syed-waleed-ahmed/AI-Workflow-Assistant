# Render blueprint for the API. In the Render dashboard: New → Blueprint → select this
# repository. Values marked `sync: false` are entered once in the dashboard and never stored
# in the repository. See DEPLOYMENT.md for the full walkthrough.
services:
  - type: web
    name: ai-workflow-assistant-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: datasets
      # Browser → Vercel proxy → Render proxy → app: the client address is two hops back.
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      # Sized for the free instance (512 MB RAM, shared CPU). Raise these on a larger plan.
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_ROWS
        value: "150000"
      - key: FRAME_CACHE_MB
        value: "64"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: DB_POOL_SIZE
        value: "3"
